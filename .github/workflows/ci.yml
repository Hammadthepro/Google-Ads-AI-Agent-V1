name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: google_ads_agent_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U app" --health-interval 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/google_ads_agent_test
      REDIS_URL: redis://localhost:6379/0
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check app tests --select F,E9
      - run: pytest -p no:warnings

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - run: npx vite build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config -q
      - run: docker compose build
