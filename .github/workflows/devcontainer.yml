name: Dev container (Codespaces config)
# Builds the repository's dev container exactly from .devcontainer/devcontainer.json with the official
# Dev Containers CLI, then runs the same startup script Codespaces runs and checks the app end to end.
# This is the closest automated equivalent to creating a fresh Codespace.
on:
  push:
    branches: [main]
    paths: [".devcontainer/**", "scripts/**", "docker-compose.yml", "backend/**", "frontend/**", ".env.example",
            ".github/workflows/devcontainer.yml"]
  workflow_dispatch:

jobs:
  devcontainer:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Free disk space (the universal image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /
      - uses: actions/checkout@v4
      - name: Build dev container and run the Codespaces startup sequence
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            set -euo pipefail
            echo "== tools inside the dev container"
            command -v docker
            docker version --format 'Docker {{.Server.Version}}'
            docker compose version
            echo "== startup script (idempotent; postStartCommand may already have run it)"
            bash scripts/start.sh
            echo "== checks"
            test "$(docker compose ps --services --status running | sort | tr '\n' ' ')" = "backend beat frontend postgres redis worker "
            curl -fsS http://localhost:8000/healthz
            curl -fsS http://localhost:8000/readyz | grep -q '"database":"ok"'
            curl -fsS http://localhost:5173/ | grep -q '<div id="root">'
            docker compose exec -T backend python -m app.cli create-super-admin ci-check@example.com
            curl -fsS -X POST http://localhost:5173/api/v1/auth/dev-login -H 'Content-Type: application/json' \
              -d '{"email":"ci-check@example.com"}' | grep -q '"role":"SUPER_ADMIN"'
            curl -fsS -X POST http://localhost:5173/api/v1/auth/dev-login -H 'Content-Type: application/json' \
              -d '{"email":"nobody@example.com"}' | grep -q 'not been invited'
            docker compose exec -T backend alembic current | grep -q '(head)'
            grep -q '^GOOGLE_ADS_WRITES_ENABLED=false' .env
            ! grep -q '^INTEGRATION_MODE' .env
            echo "DEV CONTAINER OK: 6 services running, migrations at head, empty database (no demo data), login works, writes disabled"
