[project]
name = "google-ads-ai-agent"
version = "1.0.0"
description = "Google Ads AI Agent V1 - safety-first, mock-first Google Ads management platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "celery>=5.4",
  "redis>=5.0",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "extruct>=0.17",
  "groq>=0.11",
  "google-auth>=2.30",
  "google-ads>=25.0",
  "cryptography>=42",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]
browser = ["playwright>=1.45"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "real_registry: run without test fakes so the real adapter registry (and its not-configured errors) is exercised",
    "live: needs real credentials; reports NOT CONFIGURED / BLOCKED instead of passing when they are missing",
]

[tool.ruff]
line-length = 110
target-version = "py311"
