# Local / single-server deployment. Starts empty: configure integrations on the Integrations page.
#   cp .env.example .env   (set APP_SECRET_KEY)
#   docker compose up --build -d
#   docker compose exec backend python -m app.cli create-super-admin you@example.com
# To use Supabase instead of the bundled Postgres, set COMPOSE_DATABASE_URL in .env to the Supabase
# Session Pooler URL (postgresql+psycopg://...?sslmode=require). The bundled postgres then stays unused.
# backend, worker and beat run ONE image. Only the backend service builds it; worker and beat reuse that image and never build
# or pull their own, so Python dependencies are installed exactly once per build.
x-backend: &backend
  image: google-ads-ai-agent-backend:local
  env_file: .env
  environment:
    # COMPOSE_DATABASE_URL (not DATABASE_URL, which .env sets for non-Docker runs) selects the database for containers.
    DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql+psycopg://app:app@postgres:5432/google_ads_agent}
    REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: google_ads_agent }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U app"], interval: 5s, retries: 20 }
  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }
  backend:
    <<: *backend
    build:
      context: ./backend
      args:
        # Package index for the image build. Set PIP_INDEX_URL (shell or .env) to a reachable mirror if PyPI is slow or blocked.
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    ports: ["8000:8000"]
  worker:
    <<: *backend
    pull_policy: never          # the image comes from the backend build above
    healthcheck: { disable: true }   # the image's health check probes the API port, which only the backend serves
    command: celery -A app.workers.celery_app worker -l info --concurrency 2
  beat:
    <<: *backend
    pull_policy: never
    healthcheck: { disable: true }
    command: celery -A app.workers.celery_app beat -l info --schedule /tmp/celerybeat-schedule
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  pgdata:
